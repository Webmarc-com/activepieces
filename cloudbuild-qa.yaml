steps:
  # Step 1: Authenticate with Google Cloud
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'auth'
      - 'configure-docker'
      - 'europe-west3-docker.pkg.dev'

  # Step 2: Build Docker image for QA environment
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west3-docker.pkg.dev/surfsite-development/surfsite-qa/activepieces:${SHORT_SHA}'
      - '-f'
      - 'Dockerfile'
      - '.'
    timeout: '1800s'  # 30 minutes - Activepieces build can take time

  # Step 3: Push the Docker image to the 'surfsite-qa' repository
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west3-docker.pkg.dev/surfsite-development/surfsite-qa/activepieces:${SHORT_SHA}'

  # Step 4: Set up SSH key and clone the Git repository
  - name: 'gcr.io/cloud-builders/git'
    id: 'Setup SSH Key and Clone Repo'
    entrypoint: 'bash'
    secretEnv: ['SSH_PRIVATE_KEY']
    args:
      - '-c'
      - |
        set -eux
        mkdir -p /root/.ssh
        echo "$${SSH_PRIVATE_KEY}" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan -t rsa github.com >> /root/.ssh/known_hosts
        chmod 600 /root/.ssh/known_hosts
        # Create SSH config file
        echo -e "Host github.com\n\tIdentityFile /root/.ssh/id_ed25519\n\tStrictHostKeyChecking no\n" > /root/.ssh/config
        chmod 600 /root/.ssh/config
        # Clone the repository
        git clone git@github.com:Webmarc-com/surfsite-CI-CD.git repo

  # Step 5: Update the image tag in Kubernetes manifests
  - name: 'ubuntu'
    id: 'Update Image Tag surfsite-qa'
    dir: 'repo'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|\(image: .*/activepieces:\).*|\1${SHORT_SHA}|" surfsite/qa/activepieces/deployment.yaml

  # Step 6: Commit and push the changes back to GitHub
  - name: 'gcr.io/cloud-builders/git'
    id: 'Commit and Push Changes'
    entrypoint: 'bash'
    dir: 'repo'
    secretEnv: ['SSH_PRIVATE_KEY']
    args:
      - '-c'
      - |
        set -eux
        # Set up SSH key again
        mkdir -p /root/.ssh
        echo "$${SSH_PRIVATE_KEY}" > /root/.ssh/id_ed25519
        chmod 400 /root/.ssh/id_ed25519
        ssh-keyscan -t rsa github.com >> /root/.ssh/known_hosts
        chmod 600 /root/.ssh/known_hosts
        # Create SSH config file
        echo -e "Host github.com\n\tIdentityFile /root/.ssh/id_ed25519\n\tStrictHostKeyChecking no\n" > /root/.ssh/config
        chmod 600 /root/.ssh/config
        # Configure Git
        git config --global user.email "cloud-build@surfsite.ai"
        git config --global user.name "Cloud Build"
        # Commit and push changes
        git add .
        git commit -m "Update activepieces QA image to ${SHORT_SHA}" || echo "No changes to commit"
        git push origin main

images:
  - 'europe-west3-docker.pkg.dev/surfsite-development/surfsite-qa/activepieces:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  machineType: 'E2_HIGHCPU_8'  # Use higher CPU for faster builds

# Available secrets
availableSecrets:
  secretManager:
    - versionName: projects/890185774415/secrets/cloud-build-charger-ssh-key/versions/latest
      env: SSH_PRIVATE_KEY

timeout: '3600s'  # 60 minutes total timeout for the entire build
